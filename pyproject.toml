[project]
name = "gomoku"
version = "0.1.0"
description = "Gomoku game with AI"
readme = "AI_STRATEGY.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0"
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx"
]
